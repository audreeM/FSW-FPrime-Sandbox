# West manifest for this F´/Zephyr deployment - RP2040/RP2350 only.
#
# The module set is imported from Zephyr's own manifest rather than pinned
# here, so the modules always match the Zephyr revision above them. The
# name-allowlist keeps the import down to what an RP2040/RP2350 build needs,
# which avoids fetching the full Zephyr module set.
#
# `revision` is a an exact commit rather than a release tag on purpose: this
# deployment is built against a Zephyr 4.4 development commit. Zephyr 4.4
# changed uart_irq_update() from returning int to returning void, and
# patches/0002 adapts the fprime-zephyr UART driver to that signature. On
# Zephyr 4.3 that patch does not apply and the build breaks, so moving this
# revision means revisiting that patch.

manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  # Import filter to exclude optional groups
  group-filter: [-babblesim, -optional]

  projects:
    # Zephyr RTOS core - v4.4.0-15270-g5a5e6c5b3cb
    - name: zephyr
      repo-path: zephyr
      revision: 5a5e6c5b3cb9ead148f4d10c6f6e44333b6c5339
      # path-prefix below applies to this project too, placing Zephyr at
      # lib/zephyr-workspace/zephyr.
      path: zephyr
      west-commands: scripts/west-commands.yml
      import:
        # Import specific submanifests only (instead of all submanifests)
        name-allowlist:
          - cmsis         # ARM CMSIS support (required for Cortex-M)
          - cmsis_6       # ARM CMSIS 6 support (required for RPI)
          - hal_rpi_pico  # Raspberry Pi Pico HAL (REQUIRED for RP2040/RP2350)
          - picolibc      # C library
          - hal_nxp       # Required for Teensy
          - loramac-node  # Required by the fprime-zephyr LoRa driver
        # Keep the imported modules under lib/zephyr-workspace/ alongside Zephyr
        # itself, rather than at the repository root.
        path-prefix: lib/zephyr-workspace

  self:
    path: .
